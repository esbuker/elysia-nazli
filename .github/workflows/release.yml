name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: bump package version + publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Redis and KeyDB
        run: |
          docker pull redis:7.2-alpine
          docker pull eqalpha/keydb:latest
          docker run -d --name redis-nazli-test -p 6379:6379 redis:7.2-alpine
          docker run -d --name keydb-nazli-test -p 6380:6379 eqalpha/keydb:latest

          for i in {1..30}; do
            if docker exec redis-nazli-test redis-cli ping && docker exec keydb-nazli-test keydb-cli ping; then
              exit 0
            fi
            sleep 1
          done

          docker logs redis-nazli-test
          docker logs keydb-nazli-test
          exit 1

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          REDIS_URL: redis://localhost:6379
          KEYDB_URL: redis://localhost:6380
        run: bun test tests

      - name: Check version from release tag
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must be a semver tag like v1.2.3 or 1.2.3"
            exit 1
          fi

          PACKAGE_VERSION="$(bun -e 'console.log(require("./package.json").version)')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PACKAGE_VERSION" = "$VERSION" ]; then
            echo "Package version is already $VERSION"
          else
            echo "Package version is $PACKAGE_VERSION and will be bumped to $VERSION"
          fi

      - name: Bump package.json version if needed
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          bun -e '
            const fs = require("node:fs");
            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));

            if (pkg.version === process.env.VERSION) {
              console.log(`package.json is already at version ${pkg.version}`);
              process.exit(0);
            }

            console.log(`Bumping package.json from ${pkg.version} to ${process.env.VERSION}`);
            pkg.version = process.env.VERSION;
            fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - name: Commit version bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json is already at version $VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump package version to $VERSION"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

      - name: Build
        run: bun run build

      - name: Publish to npm
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          npm --version
          npm publish --tag "$NPM_TAG"
